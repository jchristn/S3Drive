# S3Drive observability stack.
#
# The S3Drive agent runs on the host (it owns the Dokan mounts), so this stack is the
# operator side only: an OpenTelemetry Collector that receives the agent's OTLP push and fans
# it out to Prometheus (metrics), Tempo (traces), and Loki (logs), plus Grafana with the
# S3Drive dashboards provisioned.
#
#   docker compose -f docker/compose.yaml up -d
#
# Then enable OTLP export in ~/.s3drive/s3drive.json ("telemetry": { "otlpEnabled": true })
# or set S3DRIVE_OTLP_ENABLED=true, and restart the agent. See TELEMETRY.md.
#
# Every host port binds 127.0.0.1 only and can be moved with an environment variable (for
# example S3DRIVE_GRAFANA_PORT=13000) when the default is already taken.
#
# Grafana defaults to admin/admin for local development only. Outside a laptop, set
# GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD out of band (environment or .env that is
# not committed); never bake a real password into this file.

services:

  tempo:
    container_name: 's3drive-tempo'
    restart: 'unless-stopped'
    # Pinned: later Tempo releases reject the ingester/compactor sections in tempo.yaml.
    image: 'grafana/tempo:2.6.1'
    command: ['-config.file=/etc/tempo.yaml']
    ports:
      - '127.0.0.1:${S3DRIVE_TEMPO_PORT:-3200}:3200'
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - s3drive-tempo-data:/var/tempo
    healthcheck:
      # The tempo image ships wget (not curl); /ready returns 503 until fully ready, then 200.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3200/ready || exit 1']
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 40s

  loki:
    container_name: 's3drive-loki'
    restart: 'unless-stopped'
    image: 'grafana/loki:3.2.1'
    command: ['-config.file=/etc/loki/loki.yaml']
    ports:
      - '127.0.0.1:${S3DRIVE_LOKI_PORT:-3100}:3100'
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - s3drive-loki-data:/loki
    healthcheck:
      # The loki image ships busybox wget (not curl); /ready returns 200 once the ring is up.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3100/ready || exit 1']
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s

  otel-collector:
    container_name: 's3drive-otel-collector'
    restart: 'unless-stopped'
    image: 'otel/opentelemetry-collector-contrib:0.109.0'
    command: ['--config=/etc/otel-collector.yaml']
    ports:
      - '127.0.0.1:${S3DRIVE_OTLP_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${S3DRIVE_OTLP_HTTP_PORT:-4318}:4318'
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    # The collector image is distroless (no shell, curl, or wget), so it cannot carry a Docker
    # healthcheck; its health_check extension answers on :13133 inside the network instead.
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy

  prometheus:
    container_name: 's3drive-prometheus'
    restart: 'unless-stopped'
    image: 'prom/prometheus:v3.5.4'
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '127.0.0.1:${S3DRIVE_PROMETHEUS_PORT:-9090}:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - s3drive-prometheus-data:/prometheus
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      # The prometheus image ships wget (not curl); /-/healthy returns 200 when ready.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1']
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 20s

  grafana:
    container_name: 's3drive-grafana'
    restart: 'unless-stopped'
    image: 'grafana/grafana-oss:13.0.2'
    ports:
      - '127.0.0.1:${S3DRIVE_GRAFANA_PORT:-3000}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: '${GF_SECURITY_ADMIN_USER:-admin}'
      GF_SECURITY_ADMIN_PASSWORD: '${GF_SECURITY_ADMIN_PASSWORD:-admin}'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - s3drive-grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../assets/grafana:/var/lib/grafana/dashboards/s3drive:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s

volumes:
  s3drive-tempo-data:
  s3drive-loki-data:
  s3drive-prometheus-data:
  s3drive-grafana-data:
